# 每次把代码推送到 main，自动：装依赖 → 跑检查 → 打包网页 → 同步到安卓工程 → 打 debug APK → 发布到 Releases。
# 也可以在仓库的 Actions 页面手动点「Run workflow」。
name: 打包安卓 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 装依赖
        run: npm ci

      - name: 规则和存档的自动检查
        run: npm test

      - name: 打包网页
        run: npm run build

      - name: 同步到安卓工程
        run: npx cap sync android

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 取出固定的调试签名
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > android/app/debug.keystore
            echo "用仓库 Secret 里的固定签名"
          else
            echo "::warning::没有设置 DEBUG_KEYSTORE_B64，这次用临时签名：装新版本前要先卸载旧版本（会丢存档）"
          fi

      - name: 打 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 改个好认的文件名
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/back-screen-pet-${BUILD_NUMBER}.apk"
          ls -la out

      - name: 存一份到这次运行的附件里
        uses: actions/upload-artifact@v4
        with:
          name: back-screen-pet-${{ github.run_number }}
          path: out/*.apk

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${BUILD_NUMBER}"
          gh release create "$TAG" out/*.apk \
            --target "$GITHUB_SHA" \
            --title "背屏宠物 第 ${BUILD_NUMBER} 次打包" \
            --notes "自动打包的调试版 APK（版本 0.1.${BUILD_NUMBER}）。在手机上点下面的 .apk 文件下载安装；装过旧版的直接覆盖安装，存档会保留。"
